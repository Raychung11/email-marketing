; Supervisor configuration for AI Growth Hub queue workers.
;
; Copy to /etc/supervisor/conf.d/aigrowthhub.conf, adjust the paths, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Workers exit voluntarily after --max-jobs or a memory ceiling; Supervisor
; restarts them. That is how a long-running PHP process stays healthy.
;
; numprocs is the concurrency knob. Tune it against the CURRENT SES rate limit
; for your account and Region — the worker reads the live quota rather than
; assuming one, but running more workers than the quota allows just produces
; throttling errors.

[program:aigh-transactional]
; Operational mail first: a password reset must never wait behind a marketing blast.
command=php /var/www/aigrowthhub/workers/worker.php --queue=email_high_priority,email_transactional --sleep=1 --max-jobs=1000
directory=/var/www/aigrowthhub
user=www-data
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
; Give an in-flight send time to finish rather than killing it mid-provider-call.
stopwaitsecs=60
stopsignal=TERM
stdout_logfile=/var/www/aigrowthhub/storage/logs/worker-transactional.log
stderr_logfile=/var/www/aigrowthhub/storage/logs/worker-transactional.err.log

[program:aigh-marketing]
command=php /var/www/aigrowthhub/workers/worker.php --queue=email_marketing --sleep=1 --max-jobs=500
directory=/var/www/aigrowthhub
user=www-data
autostart=true
autorestart=true
numprocs=4
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=60
stopsignal=TERM
stdout_logfile=/var/www/aigrowthhub/storage/logs/worker-marketing.log
stderr_logfile=/var/www/aigrowthhub/storage/logs/worker-marketing.err.log

[program:aigh-retry]
; Retries live on their own queue so a hot-looping failure cannot starve
; first-attempt work.
command=php /var/www/aigrowthhub/workers/worker.php --queue=email_retry --sleep=5 --max-jobs=200
directory=/var/www/aigrowthhub
user=www-data
autostart=true
autorestart=true
numprocs=1
stopwaitsecs=60
stopsignal=TERM
stdout_logfile=/var/www/aigrowthhub/storage/logs/worker-retry.log
stderr_logfile=/var/www/aigrowthhub/storage/logs/worker-retry.err.log

[program:aigh-background]
; Automation steps, outbound webhooks, imports and analytics rollups.
command=php /var/www/aigrowthhub/workers/worker.php --queue=automation,webhooks,imports,analytics --sleep=2 --max-jobs=500
directory=/var/www/aigrowthhub
user=www-data
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=60
stopsignal=TERM
stdout_logfile=/var/www/aigrowthhub/storage/logs/worker-background.log
stderr_logfile=/var/www/aigrowthhub/storage/logs/worker-background.err.log

[group:aigrowthhub]
programs=aigh-transactional,aigh-marketing,aigh-retry,aigh-background
priority=999
